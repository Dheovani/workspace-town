services:
  postgres:
    image: postgres:17-alpine
    container_name: workspace-town-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workspace_town
      POSTGRES_USER: workspace_town
      POSTGRES_PASSWORD: workspace_town
    ports:
      - "5432:5432"
    volumes:
      - workspace_town_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace_town -d workspace_town"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workspace_town_postgres_data:
